# Production: the app behind Caddy, which gets and renews the HTTPS certificate on its own.
#   1. point the domain's A record at the server
#   2. cp .env.local.example .env.production and fill in the keys; put KINWARDEN_DOMAIN=your.domain in .env (Compose reads it from there)
#   3. docker compose up -d --build
services:
  app:
    build: .
    env_file: .env.production
    volumes:
      - kinwarden-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      KINWARDEN_DOMAIN: ${KINWARDEN_DOMAIN:?set KINWARDEN_DOMAIN, e.g. kinwarden.app}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  kinwarden-data:
  caddy-data:
  caddy-config:
