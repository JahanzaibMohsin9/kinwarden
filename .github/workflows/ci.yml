name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # RouteContext and LayoutProps are global types generated by Next (git ignores them).
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Unit tests
        run: npm test

      # Replays the curated live runs in recordings/ through today's tools, safety gateway and rules engine.
      # No API keys: the live eval (npm run eval:live) stays a manual run.
      - name: Eval (replay)
        run: npm run eval:replay

  # NEAR vault and test token. The sandbox node needs Linux with glibc >= 2.39 (Ubuntu 24.04).
  # rust-toolchain.toml pins Rust 1.95.0 and the wasm target; rustup installs them on first use.
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: contracts/near
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/near

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # The sandbox tests build the contracts with the cargo-near CLI. Official release
      # binary, checked against the SHA-256 recorded when this version was adopted.
      - name: Install cargo-near 0.22.0
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          file=cargo-near-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLO "https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/$file"
          echo "9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a *$file" | sha256sum -c -
          tar -xzf "$file"
          install -m 755 cargo-near-x86_64-unknown-linux-gnu/cargo-near "$HOME/.cargo/bin/cargo-near"
          cargo near --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test -p kinwarden-vault -p kinwarden-tusdc

      # Deploys both contracts to a local NEAR node; no wallet, testnet account or API key.
      - name: Sandbox tests
        run: cargo test -p kinwarden-near-tests
